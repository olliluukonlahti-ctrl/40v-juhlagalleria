name: Deploy to GitHub Pages

on:
  push:
    branches:
      - olliluukonlahti-ctrl-birthday-gallery
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare site files
        run: |
          mkdir public
          cp index.html hallinta.html lataa.html naytto.html door-camera.html admin.js admin.css app.js backend.js config.js naytto.js door-camera.js styles.css screen.css upload.css door-camera.css upload.js public/
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
